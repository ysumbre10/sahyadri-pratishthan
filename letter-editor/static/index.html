<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; img-src data: blob:; font-src data: blob:; style-src 'unsafe-inline'; connect-src 'self'; frame-src blob:; base-uri 'none'; form-action 'none'"><title>पत्रलेखन | सह्याद्री प्रतिष्ठान</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f4f6;color:#252525;font:16px/1.6 'Kohinoor Devanagari',Mangal,Arial,sans-serif}main{max-width:460px;margin:10vh auto;padding:32px;background:#fff;border-top:5px solid #ed651b;box-shadow:0 10px 40px #0001}h1{font-size:28px;margin:0 0 16px}.brand{color:#a83a08;font-weight:700}label,input,button{display:block;width:100%;font:inherit}input{padding:12px;border:1px solid #858b92;border-radius:5px;margin:8px 0 18px}button{padding:12px;background:#b63f08;color:#fff;border:0;border-radius:5px;cursor:pointer}button:disabled{opacity:.6}a{color:#923409}#status{min-height:26px;color:#9f300a}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #2a65af;outline-offset:3px}iframe{display:block;border:0;width:100%;height:100dvh}@media(max-width:500px){main{margin:30px 16px;padding:24px}}</style><script src="unlock.js" defer></script></head><body><main><p class="brand">सह्याद्री प्रतिष्ठान</p><h1>पत्रलेखन कक्ष</h1><p>पत्र तयार करण्यासाठी दिलेला पासवर्ड वापरा.</p><form id="unlock"><label for="password">पासवर्ड</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><button id="enter">प्रवेश करा</button></form><p id="status" role="status" aria-live="polite"></p><p>पासवर्डसाठी संस्थेच्या प्रशासकाशी संपर्क साधा.</p><a href="/">वेबसाइटवर परत जा</a><noscript>हा संपादक वापरण्यासाठी JavaScript सुरू करा.</noscript></main></body></html>
