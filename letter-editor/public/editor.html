<!doctype html><html lang="mr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>पत्रलेखन | सह्याद्री प्रतिष्ठान</title><link rel="stylesheet" href="/style.css"><script src="/editor.js" defer></script><header><div><p class="brand">सह्याद्री प्रतिष्ठान</p><h1>पत्रलेखन कक्ष</h1></div><form action="/logout" method="post"><button class="secondary">बाहेर पडा</button></form></header><main class="workspace"><form id="fields" class="controls"><h2>पत्राचा तपशील</h2><div class="row"><label>दिनांक<input id="date" type="date" required></label><label>क्रमांक प्रकार<select id="kind"><option>जावक क्र.</option><option>आवक क्र.</option></select></label></div><label>आवक / जावक क्रमांक<input id="number" maxlength="180" placeholder="SPH037 / २०२६"></label><label>प्रति<textarea id="recipient" rows="4" placeholder="नाव, पद व पत्ता" maxlength="2000"></textarea></label><label>विषय<textarea id="subject" rows="2" maxlength="1500"></textarea></label><label>संबोधन<input id="salutation" value="मा. महोदय," maxlength="200"></label><label>पत्राचा मजकूर<textarea id="body" rows="10" maxlength="50000" placeholder="येथे पत्राचा मजकूर लिहा. नवीन परिच्छेदासाठी Enter दाबा."></textarea></label><label>समारोप<textarea id="closing" rows="2" maxlength="1000">कळावे. धन्यवाद!
आपला विश्वासू,</textarea></label><h2>स्वाक्षरी व संपर्क</h2><label>स्वाक्षरी अपलोड करा (PNG / JPG, कमाल 2 MB)<input id="signature" type="file" accept="image/png,image/jpeg"></label><button id="remove-signature" type="button" class="secondary">स्वाक्षरी काढा</button><label>नाव<input id="name" maxlength="200"></label><label>पद / संस्था<textarea id="designation" rows="2" maxlength="400"></textarea></label><label>फोन / ईमेल<input id="contact" maxlength="250"></label><label>अक्षर आकार<select id="size"><option value="16">सामान्य</option><option value="15">लहान</option><option value="18">मोठा</option></select></label><div class="actions"><button type="button" id="print">प्रिंट / PDF सेव्ह करा</button><button type="button" id="save" class="secondary">मसुदा डाउनलोड करा</button><label class="draft-label">मसुदा उघडा<input type="file" id="load" accept="application/json,.json"></label></div><p>PDF साठी प्रिंट विंडोमध्ये “Save as PDF” निवडा. Paper: A4, Margins: None, Headers and footers: Off.</p><p>मजकूर व स्वाक्षरी या टॅबमध्येच राहतात. काम पुढे सुरू ठेवण्यासाठी मसुदा डाउनलोड करा.</p><p id="status" role="status" aria-live="polite"></p></form><section class="preview" aria-label="पत्राचे पूर्वावलोकन"><div class="preview-heading"><h2>पूर्वावलोकन</h2><span id="page-count"></span></div><div id="pages"></div></section></main></html>
